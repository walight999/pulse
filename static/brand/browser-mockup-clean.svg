<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Background INK -->
  <rect width="1600" height="1000" fill="#0A0A0F"/>

  <!-- Browser window with shadow -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="translate(140 100)">
    <!-- Window body -->
    <rect width="1320" height="800" rx="14" fill="#17171C"/>

    <!-- Top bar with traffic lights + URL -->
    <rect width="1320" height="56" rx="14" fill="#222229"/>
    <rect y="54" width="1320" height="2" fill="#0a0a0f"/>
    <circle cx="28" cy="28.0" r="8" fill="#ff5f56"/>
    <circle cx="56" cy="28.0" r="8" fill="#ffbd2e"/>
    <circle cx="84" cy="28.0" r="8" fill="#27c93f"/>
    <rect x="160" y="14.0" rx="6" ry="6" width="1020" height="28" fill="#0e0e15" stroke="#2a2a32" stroke-width="1"/>
    <text x="180" y="33.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#FAFAF7" opacity="0.55">mintforai.com</text>

    <!-- Sidebar -->
    <rect y="56" width="240" height="744" fill="#0e0e14"/>
    <!-- Brand row in sidebar -->
    <g transform="translate(24 84)">
      <rect width="36" height="36" rx="8" fill="#0A0A0F"/>
      <text x="18" y="25" text-anchor="middle" font-family="Inter Tight, Inter, sans-serif" font-weight="800" font-size="22" fill="#FAFAF7" letter-spacing="-1">P</text>
      <line x1="0" y1="22" x2="36" y2="22" stroke="#00E5A0" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="24" font-family="Inter Tight, Inter, sans-serif" font-weight="700" font-size="20" fill="#FAFAF7" letter-spacing="-0.5">pulse</text>
    </g>
    <!-- Nav items -->
    <g font-family="Inter Tight, Inter, sans-serif" font-size="14" fill="#FAFAF7" opacity="0.8">
      <rect x="16" y="156" width="208" height="40" rx="8" fill="#00E5A0" opacity="0.15"/>
      <text x="32" y="181" fill="#00E5A0" font-weight="600">Overview</text>
      <text x="32" y="221" opacity="0.7">Subscriptions</text>
      <text x="32" y="261" opacity="0.7">Activity</text>
      <text x="32" y="301" opacity="0.7">AI usage</text>
      <text x="32" y="341" opacity="0.7">Settings</text>
    </g>

    <!-- Main content area -->
    <g transform="translate(280 88)">
      <!-- Greeting -->
      <text font-family="Inter Tight, Inter, sans-serif" font-weight="700" font-size="26" fill="#FAFAF7" letter-spacing="-0.5">
        <tspan>Good morning, White</tspan>
        <tspan dx="14" font-size="12" font-weight="600" fill="#00E5A0">47-day streak</tspan>
      </text>
      <text y="32" font-family="Inter Tight, Inter, sans-serif" font-size="14" fill="#FAFAF7" opacity="0.6">Mint for the AI era</text>

      <!-- ECG line -->
      <path d="M 0 56 L 100 56 L 130 38 L 160 76 L 190 28 L 220 70 L 260 56 L 360 56 L 420 56 L 880 56"
            stroke="#00E5A0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

      <!-- ROI hero card -->
      <g transform="translate(0 96)">
        <rect width="880" height="220" rx="14" fill="#0A0A0F" stroke="#00E5A0" stroke-width="1" opacity="0.95"/>
        <text x="24" y="32" font-family="Inter Tight, Inter, sans-serif" font-weight="700" font-size="11" fill="#00E5A0" letter-spacing="2">EXCELLENT VALUE  ★★★★★</text>
        <text x="24" y="48" font-family="Inter Tight, Inter, sans-serif" font-size="11" fill="#FAFAF7" opacity="0.6">Power user</text>
        <text x="24" y="140" font-family="Inter Tight, Inter, sans-serif" font-weight="800" font-size="80" fill="#00E5A0" letter-spacing="-3">10.5<tspan font-size="44">×</tspan></text>
        <text x="24" y="170" font-family="Inter Tight, Inter, sans-serif" font-size="13" fill="#FAFAF7" opacity="0.7">return on plan cost</text>
        <text x="24" y="200" font-family="Inter Tight, Inter, sans-serif" font-size="14" fill="#FAFAF7" opacity="0.85">You're crushing it — elite mileage out of this plan.</text>
      </g>

      <!-- KPI grid -->
      <g transform="translate(0 340)" font-family="Inter Tight, Inter, sans-serif">
        <rect width="220" height="80" rx="10" fill="#0A0A0F" stroke="#22222a" stroke-width="1"/>
        <text x="16" y="26" font-size="10" fill="#FAFAF7" opacity="0.6" letter-spacing="1">MONTHLY</text>
        <text x="16" y="58" font-weight="700" font-size="22" fill="#FAFAF7">฿4,289</text>

        <g transform="translate(240 0)">
          <rect width="220" height="80" rx="10" fill="#0A0A0F" stroke="#22222a" stroke-width="1"/>
          <text x="16" y="26" font-size="10" fill="#FAFAF7" opacity="0.6" letter-spacing="1">AI THIS MONTH</text>
          <text x="16" y="58" font-weight="700" font-size="22" fill="#00E5A0">฿14,287</text>
        </g>

        <g transform="translate(480 0)">
          <rect width="220" height="80" rx="10" fill="#0A0A0F" stroke="#22222a" stroke-width="1"/>
          <text x="16" y="26" font-size="10" fill="#FAFAF7" opacity="0.6" letter-spacing="1">APP HOURS (7D)</text>
          <text x="16" y="58" font-weight="700" font-size="22" fill="#FAFAF7">42.3h</text>
        </g>
      </g>
    </g>
  </g>
</svg>