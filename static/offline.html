<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Offline</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0b0f; color: #e8e8ec;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
      max-width: 360px; text-align: center;
      background: #16181d; border: 1px solid #26272e;
      border-radius: 16px; padding: 32px 28px;
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 1.6rem;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { color: #a3a4ae; margin: 0 0 18px; line-height: 1.5; font-size: 0.92rem; }
    button {
      background: #6366f1; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">P</div>
    <h1>You're offline</h1>
    <p>Pulse needs an internet connection to sync. Your local data is safe — reconnect to see the latest.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
