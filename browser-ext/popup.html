<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 280px; padding: 16px; margin: 0;
      background: #0a0b0f; color: #e8e8ec;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: #000; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 0.95rem; letter-spacing: -0.04em;
    }
    .logo::after {
      content: ""; position: absolute; left: 0; right: 0; top: 55%;
      height: 2px; background: linear-gradient(90deg, transparent, #34d399 20%, #6ee7b7 50%, #34d399 80%, transparent);
      box-shadow: 0 0 6px rgba(52,211,153,0.6);
    }
    .name { font-weight: 700; font-size: 1.05rem; }
    .stats { font-size: 0.85rem; color: #a3a4ae; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    button {
      width: 100%; padding: 8px 12px; background: #10b981; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      font-size: 0.85rem; margin-top: 8px;
    }
    button:hover { background: #059669; }
    .status {
      font-size: 0.75rem; color: #6a6b76; margin-top: 8px; text-align: center;
    }
    .ok { color: #34d399; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">P</div>
    <div class="name" style="text-transform:lowercase; letter-spacing:-0.02em;">pulse</div>
  </div>
  <div class="stats" id="stats">Loading...</div>
  <button id="flush">Sync now</button>
  <div class="status" id="status">Waiting for desktop app...</div>
  <script src="popup.js"></script>
</body>
</html>
