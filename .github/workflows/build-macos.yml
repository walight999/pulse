name: build-macos

# Runs on every push to main (and on manual trigger) to keep the latest
# unsigned macOS .app build available as a workflow artifact for community
# testing — so we don't need to wait for a release tag to validate that the
# macOS port still works.
#
# Signed/notarized builds happen in release.yml when a tag is pushed (and
# APPLE_DEVELOPER_ID secret is set).

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pulse-macos.spec"
      - "scripts/build_macos.sh"
      - "requirements.txt"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-macos-unsigned:
    name: Unsigned macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow rumps

      - name: Run tests
        run: pytest -q tests/

      - name: Build .app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
        # APPLE_DEVELOPER_ID intentionally not set — produces an unsigned build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-unsigned-${{ github.sha }}
          path: dist/pulse-macos-*.zip
          retention-days: 14

      - name: Summary
        run: |
          echo "## Unsigned macOS build available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built from commit \`${{ github.sha }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Artifacts section above. Unsigned — Gatekeeper will warn on first open." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To run an unsigned .app on macOS:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Unzip and try to open — Gatekeeper blocks it" >> $GITHUB_STEP_SUMMARY
          echo "2. System Settings → Privacy & Security → click 'Open anyway' next to the pulse warning" >> $GITHUB_STEP_SUMMARY
          echo "3. Or from terminal: \`xattr -dr com.apple.quarantine pulse.app && open pulse.app\`" >> $GITHUB_STEP_SUMMARY
