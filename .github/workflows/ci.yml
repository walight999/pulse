name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python · syntax + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Syntax check every .py file
        run: |
          python -c "
          import ast, sys
          from pathlib import Path
          errors = 0
          for f in Path('.').rglob('*.py'):
              if any(p in str(f) for p in ['__pycache__', '.venv', 'venv', 'pulse-brand-core/output', 'data/']):
                  continue
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR: {f}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Run pytest
        run: pytest -q tests/

      - name: Ruff (style lint, advisory)
        run: ruff check . --exit-zero --select=E9,F63,F7,F82 --statistics
        continue-on-error: true

      - name: Verify markdown links don't 404 (offline check only)
        run: |
          python -c "
          from pathlib import Path
          import re
          missing = []
          for f in Path('.').rglob('*.md'):
              if any(p in str(f) for p in ['node_modules', '.venv', 'pulse-brand-core/output']):
                  continue
              txt = f.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'\]\(([^)]+\.md)\)', txt):
                  ref = m.group(1)
                  if ref.startswith('http'):
                      continue
                  target = (f.parent / ref).resolve()
                  if not target.exists():
                      missing.append(f'{f} -> {ref}')
          if missing:
              print('Missing markdown link targets:')
              for m in missing[:20]:
                  print(f'  {m}')
          "

  landing:
    name: Landing · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install
        working-directory: landing
        run: npm ci || npm install

      - name: TypeScript typecheck
        working-directory: landing
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: landing
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
